site_name: groundmeas
site_description: Grounding System Measurements & Analysis
site_author: Christian Ehlert
repo_url: https://github.com/Ce1ectric/groundmeas
repo_name: Ce1ectric/groundmeas

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy

nav:
  - Home: index.md
  - Quickstart: 02_quickstart.md
  - Data Model: 01_datamodels.md
  - Tutorials:
      - Overview: 10_tutorial_intro.md
      - Create Measurements: 11_create_measurements.md
      - Read Measurements: 12_read_measurements.md
      - Change Measurements: 13_change_measurements.md
      - Import & Export: 14_import_export.md
      - Analytics: 15_analytics.md
      - Dashboard: 16_dashboard.md
      - Import from OMICRON instruments: 17_instrument_import.md
  - Tower campaigns:
      - Overview: towers/index.md
      - Quickstart: towers/quickstart.md
      - Preparing a campaign: towers/campaign.md
      - Configuration: towers/configuration.md
      - Command line: towers/cli.md
      - Results: towers/results.md
      - Campaigns in the database: towers/database.md
      - Python API: towers/python.md
      - Troubleshooting: towers/troubleshooting.md
      - Physical background: towers/physics.md
      - Assessment procedure: towers/assessment.md
      - Migration from tower-grounding-measurement: towers/migration.md
  - Reference:
      - Overview: 20_ref_intro.md
      - API: 21_ref_api.md
      - CLI: 22_ref_cli.md
  - ADRs:
      - Index: adr/README.md
      - 0001 — Compatibility-shim deprecation strategy: adr/0001-compatibility-shim-deprecation-strategy.md
  - Contributing: 99_contributing.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  # polyfill.io was removed: the domain was sold in June 2024 and the CDN
  # subsequently served malicious JavaScript. Modern browsers do not need a
  # polyfill for MathJax 3 (see https://www.mathjax.org/#docs).
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
